
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Interest Calculator</title>
 </head>
 <body>
    <h2>Interest Calculator</h2>
    <form id="interestForm">
        <label for="principal">Principal Amount:</label>
        <input type="number" id="principal" name="principal" required><br><br>

        <label for="rate">Rate of Interest (%):</label>
        <input type="number" id="rate" name="rate" required><br><br>

        <label for="time">Time (years):</label>
        <input type="number" id="time" name="time" required><br><br>


        <button type="button" onclick="calculateInterest()">Calculate Interest</button>
    </form>
    <h3>Calculated Interest: <span id="result"></span></h3>

    <script src="script.js"></script>
    

 </body>
 </html>
